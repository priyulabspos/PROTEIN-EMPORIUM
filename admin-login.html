<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin Portal Login – Protein Emporium</title>
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --tx: #f3eee6;
  --mu: #9b9385;
  --bd: #2e261f;
  --bg: #120f0c;
  --card-bg: #1a1612;
  --or: #f58a07;
  --or-dk: #d97400;
  --gr: #16a34a;
  --rd: #ef4444;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font: 16px/1.55 'Barlow', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--tx);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background-image: radial-gradient(circle at 50% 20%, #261f18 0%, #120f0c 70%);
}
h1,h2,h3,h4,.dsp{
  font-family: 'Barlow Condensed', Impact, sans-serif;
  font-weight: 800;
  letter-spacing: 0.02em;
}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;color:inherit;background:none;border:0}
input{font:inherit}

.top-bar{
  padding: 16px 28px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--bd);
}
.brand img{height:50px;width:auto;object-fit:contain}
.back-btn{
  color: var(--mu);
  font-size: 14px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px;
  border-radius: 8px;
  border: 1px solid var(--bd);
  background: #181410;
  transition: all 0.2s;
}
.back-btn:hover{color:#fff;border-color:var(--or)}

.login-wrapper{
  flex: 1;
  max-width: 460px;
  width: 100%;
  margin: 50px auto;
  padding: 0 20px;
}
.admin-card{
  background: var(--card-bg);
  border: 1.5px solid var(--bd);
  border-radius: 18px;
  padding: 38px 32px;
  box-shadow: 0 16px 40px rgba(0,0,0,0.45);
}
.admin-badge{
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(245,138,7,0.15);
  color: var(--or);
  border: 1px solid rgba(245,138,7,0.3);
  font: 800 12px 'Barlow Condensed';
  padding: 4px 10px;
  border-radius: 5px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 12px;
}
.admin-header{text-align:center;margin-bottom:28px}
.admin-header img{height:72px;width:auto;margin-bottom:12px;filter:drop-shadow(0 6px 14px rgba(0,0,0,0.6))}
.admin-header h1{font-size:30px;text-transform:uppercase;color:#fff}
.admin-header p{color:var(--mu);font-size:14.5px;margin-top:4px}

.fg{margin-bottom:20px}
.fg label{display:block;font-size:13.5px;font-weight:700;color:#d5cdc2;margin-bottom:6px}
.fg input{
  width: 100%;
  padding: 12px 16px;
  border: 1.5px solid var(--bd);
  border-radius: 10px;
  font-size: 15px;
  background: #14110e;
  color: #fff;
  transition: all 0.2s;
}
.fg input:focus{
  outline: none;
  border-color: var(--or);
  box-shadow: 0 0 0 3px rgba(245,138,7,0.22);
}

.btn-admin{
  width: 100%;
  background: var(--or);
  color: #120f0c;
  font-weight: 800;
  font-size: 16px;
  padding: 14px 20px;
  border-radius: 10px;
  letter-spacing: 0.03em;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: all 0.2s;
  box-shadow: 0 4px 14px rgba(245,138,7,0.4);
}
.btn-admin:hover{background:var(--or-dk);transform:translateY(-1px)}

.demo-box{
  margin-top: 24px;
  padding: 16px;
  background: #231d16;
  border: 1.5px dashed #4d3a24;
  border-radius: 12px;
  text-align: center;
}
.demo-box p{font-size:13px;color:#d5cdc2;margin-bottom:10px}
.demo-box code{color:var(--or);font-weight:700}
.demo-btn{
  background: rgba(245,138,7,0.18);
  border: 1.5px solid var(--or);
  color: var(--or);
  font-weight: 800;
  font-size: 14px;
  padding: 8px 18px;
  border-radius: 8px;
  transition: all 0.2s;
}
.demo-btn:hover{background:var(--or);color:#120f0c}

.security-note{
  margin-top: 24px;
  text-align: center;
  font-size: 13px;
  color: var(--mu);
}
.alert{
  padding: 12px 16px;
  border-radius: 8px;
  margin-bottom: 20px;
  font-size: 14px;
  font-weight: 600;
  display: none;
}
.alert.error{background:#450a0a;color:#fca5a5;border:1px solid #7f1d1d}
.alert.success{background:#052e16;color:#86efac;border:1px solid #14532d}
</style>
</head>
<body>

<header class="top-bar">
  <a href="index.html" class="brand">
    <img src="assets/logo.png" alt="Protein Emporium">
  </a>
  <a href="index.html" class="back-btn">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m15 18-6-6 6-6"/></svg>
    Return to Storefront
  </a>
</header>

<main class="login-wrapper">
  <div class="admin-card">
    <div class="admin-header">
      <img src="assets/logo.png" alt="Protein Emporium">
      <div><span class="admin-badge">🔒 RESTRICTED PORTAL</span></div>
      <h1>Admin Management Console</h1>
      <p>Store orders, inventory dispatch & scratch hologram verification</p>
    </div>

    <div id="alert-box" class="alert"></div>

    <form onsubmit="handleAdminLogin(event)">
      <div class="fg">
        <label>Administrator Email / Username</label>
        <input type="text" id="admin-user" placeholder="admin@proteinemporium.com" value="admin@proteinemporium.com" required>
      </div>

      <div class="fg">
        <label>Master Security PIN / Password</label>
        <input type="password" id="admin-pass" placeholder="••••••••" value="admin123" required>
      </div>

      <button type="submit" class="btn-admin">
        <span>Authenticate & Enter Console</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>

      <div class="demo-box">
        <p>Demo Admin Credentials: <code>admin@proteinemporium.com</code> / <code>admin123</code></p>
        <button type="button" class="demo-btn" onclick="demoAdminLogin()">1-Click Instant Admin Login</button>
      </div>
    </form>

    <div class="security-note">
      🔒 256-Bit TLS End-to-End Encrypted Session • IP Logged for Security
    </div>
  </div>
</main>

<script>
function showAlert(msg, isError) {
  const el = document.getElementById('alert-box');
  el.textContent = msg;
  el.className = 'alert ' + (isError ? 'error' : 'success');
  el.style.display = 'block';
}

function handleAdminLogin(e) {
  e.preventDefault();
  const u = document.getElementById('admin-user').value.trim();
  const p = document.getElementById('admin-pass').value.trim();

  if((u === 'admin@proteinemporium.com' || u === 'admin') && p === 'admin123') {
    localStorage.setItem('pe_admin_auth', 'true');
    showAlert('Security check passed. Launching Admin Dashboard...', false);
    setTimeout(() => {
      window.location.href = 'admin-dashboard.html';
    }, 500);
  } else {
    showAlert('Invalid administrator credentials. Please check your credentials or click 1-Click Instant Login.', true);
  }
}

function demoAdminLogin() {
  localStorage.setItem('pe_admin_auth', 'true');
  showAlert('Demo Administrator Authenticated! Launching...', false);
  setTimeout(() => {
    window.location.href = 'admin-dashboard.html';
  }, 400);
}
</script>

</body>
</html>
